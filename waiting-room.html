<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Phòng chờ của FLASH MEETING." />
    <title>FLASH MEETING — Phòng chờ</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/waiting-room.css" />
  </head>
  <body class="waiting-room-page" data-waiting-state="initializing">
    <main class="waiting-shell" data-waiting-root aria-busy="true">
      <a class="brand waiting-brand" href="index.html" aria-label="FLASH MEETING - Trang chủ">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>FLASH <span class="brand-accent">MEETING</span></span>
      </a>

      <section class="waiting-card" role="status" aria-live="polite" aria-busy="true" aria-labelledby="waiting-title">
        <div class="waiting-status-icon" data-status-icon aria-hidden="true">◷</div>
        <p class="eyebrow waiting-eyebrow" data-status-kicker>Phòng chờ</p>
        <h1 id="waiting-title" data-status-title>Đang kiểm tra yêu cầu tham gia...</h1>
        <p class="waiting-copy" data-status-description>Đang khôi phục trạng thái yêu cầu của bạn.</p>

        <div class="waiting-context" data-meeting-context hidden>
          <div class="waiting-context-item">
            <span>Cuộc họp</span>
            <strong data-meeting-title></strong>
          </div>
          <div class="waiting-context-item">
            <span>Mã phòng</span>
            <strong class="waiting-room-code" data-room-code></strong>
          </div>
          <div class="waiting-context-item" data-host-context hidden>
            <span>Chủ phòng</span>
            <strong data-host-name></strong>
          </div>
        </div>

        <div class="waiting-status-line" data-status-line hidden>
          <span class="waiting-status-dot" data-status-dot aria-hidden="true"></span>
          <span data-status-line-text>Đang chờ</span>
        </div>

        <div class="waiting-actions" data-waiting-actions hidden>
          <a class="button button-primary" data-check-devices href="prejoin.html">Kiểm tra lại thiết bị</a>
          <button class="button button-secondary" type="button" data-leave-waiting>Rời phòng chờ</button>
        </div>

        <div class="waiting-result-actions" data-result-actions hidden>
          <a class="button button-primary" data-retry href="waiting-room.html">Thử lại</a>
          <a class="button button-secondary" data-home-link href="index.html">Quay lại Trang chủ</a>
          <a class="button button-secondary" data-join-another-link href="join-meeting.html" hidden>Tham gia cuộc họp khác</a>
          <a class="button button-secondary" data-login-link href="login.html" hidden>Đăng nhập lại</a>
        </div>

        <p class="waiting-note" data-status-note hidden></p>
      </section>
    </main>

    <script type="module" src="./js/meeting-waiting-room.js"></script>
  </body>
</html>
