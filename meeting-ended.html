<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kết quả phiên tham gia cuộc họp FLASH MEETING." />
    <title>FLASH MEETING — Đã rời cuộc họp</title>
    <link rel="icon" type="image/png" href="./assets/brand/flash-meeting-favicon.png" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/meeting.css" />
  </head>
  <body class="meeting-page meeting-ended-page">
    <main class="result-shell" data-result-root>
      <a class="brand result-brand" href="index.html" aria-label="FLASH MEETING - Trang chủ">
        <img class="brand-logo" src="./assets/brand/flash-meeting-icon-64.png" alt="" width="40" height="40" />
        <span>FLASH <span class="brand-accent">MEETING</span></span>
      </a>

      <section class="result-card" role="status" aria-labelledby="result-title">
        <span class="result-symbol" aria-hidden="true"><i data-lucide="circle-check"></i></span>
        <p class="eyebrow result-eyebrow" data-result-label>Phiên họp đã kết thúc</p>
        <h1 id="result-title" data-result-title tabindex="-1">Cuộc họp đã kết thúc</h1>
        <p class="result-copy" data-result-description>Phiên tham gia của bạn đã kết thúc.</p>

        <div class="result-summary" data-result-summary hidden>
          <div class="result-detail">
            <span>Cuộc họp</span>
            <strong data-result-meeting-title></strong>
          </div>
          <div class="result-detail">
            <span>Mã phòng</span>
            <strong class="result-code" data-result-room-code></strong>
          </div>
          <div class="result-detail">
            <span>Thời gian tham gia</span>
            <strong data-result-duration></strong>
          </div>
        </div>

        <div class="result-actions">
          <a class="button button-primary" href="index.html">Quay về trang chủ</a>
          <a class="button button-secondary" href="join-meeting.html">Tham gia cuộc họp khác</a>
        </div>
      </section>
    </main>

    <script type="module" src="./js/app-analytics.js"></script>
    <script type="module" src="./js/meeting-ended.js"></script>
  </body>
</html>
