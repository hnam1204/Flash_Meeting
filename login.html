<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đăng nhập vào FLASH MEETING." />
    <title>FLASH MEETING — Đăng nhập</title>
    <link rel="icon" type="image/png" href="./assets/brand/flash-meeting-favicon.png" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="auth-page" data-auth-mode="login" data-auth-state="initializing">
    <main class="auth-shell">
      <div class="brand auth-brand" aria-label="FLASH MEETING">
        <img class="brand-logo" src="./assets/brand/flash-meeting-icon-64.png" alt="" width="56" height="56" />
        <span>FLASH <span class="brand-accent">MEETING</span></span>
      </div>

      <section class="auth-card" aria-labelledby="login-title">
        <header class="auth-card-header">
          <h1 id="login-title">Đăng nhập</h1>
          <p>Sử dụng tài khoản Google để tiếp tục với FLASH MEETING.</p>
        </header>

        <div class="auth-loading" data-auth-loading role="status" aria-live="polite">
          <span class="loading-spinner" aria-hidden="true"></span>
          <span>Đang xử lý đăng nhập…</span>
        </div>

        <p class="auth-session-notice" data-session-expired-notice role="status" aria-live="polite" hidden>
          Phiên đăng nhập đã hết hạn.<br />Vui lòng đăng nhập lại bằng Google để tiếp tục.
        </p>

        <button class="button button-secondary google-button" type="button" data-google-login>
          <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.23c0-.78-.07-1.53-.22-2.23H12v4.22h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.38Z" />
            <path fill="#34A853" d="M12 21.6c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.48-4.03H3.27v2.53A9.74 9.74 0 0 0 12 21.6Z" />
            <path fill="#FBBC05" d="M6.52 13.68a5.86 5.86 0 0 1 0-3.36V7.79H3.27a9.64 9.64 0 0 0 0 8.42l3.25-2.53Z" />
            <path fill="#EA4335" d="M12 6.29c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.4 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.73 5.39l3.25 2.53C7.3 8.01 9.46 6.29 12 6.29Z" />
          </svg>
          <span data-google-label>Tiếp tục với Google</span>
        </button>
        <p class="form-status" id="auth-status" data-form-status role="status" aria-live="polite"></p>
        <p class="auth-error-detail" data-auth-error-detail hidden></p>
      </section>
    </main>
    <script type="module" src="./js/app-analytics.js"></script>
    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
